      <line x1="0" y1="0" x2="120" y2="60"/>
      <line x1="0" y1="0" x2="-80" y2="-50"/>
      <line x1="0" y1="0" x2="-100" y2="80"/>
      <line x1="100" y1="-30" x2="160" y2="-90"/>
      <line x1="120" y1="60" x2="180" y2="120"/>
      <line x1="-80" y1="-50" x2="-150" y2="-100"/>
