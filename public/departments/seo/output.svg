  <text x="120" y="380" font-family="ui-monospace, monospace" fill="#989b94" font-size="11" letter-spacing="2" opacity="0.7">CLUSTER MAP · AUTORIDAD TEMÁTICA</text>
  <text x="40" y="40" font-family="ui-monospace, monospace" fill="#c2c4bc" font-size="11" letter-spacing="2" opacity="0.7">DEPT · SEO · OUTPUT</text>
