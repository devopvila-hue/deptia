    <g transform="translate(0,24)">
      <rect width="1040" height="44" rx="6" fill="#0c0e0a" stroke="rgba(110,211,160,0.35)"/>
      <text x="20" y="28" fill="#6ed3a0" font-size="13">/</text>
      <text x="50" y="28" fill="#f2f0e9" font-size="13">cómo automatizar conciliaciones empresariales</text>
      <text x="900" y="28" text-anchor="end" fill="#6ed3a0" font-size="13">#2</text>
    </g>
    <g transform="translate(0,84)">
      <rect width="1040" height="44" rx="6" fill="#0c0e0a" stroke="rgba(110,211,160,0.35)"/>
      <text x="20" y="28" fill="#6ed3a0" font-size="13">/</text>
      <text x="50" y="28" fill="#f2f0e9" font-size="13">departamento seo mensual para empresas</text>
      <text x="900" y="28" text-anchor="end" fill="#6ed3a0" font-size="13">#1</text>
    </g>
    <g transform="translate(0,144)">
      <rect width="1040" height="44" rx="6" fill="#0c0e0a" stroke="rgba(110,211,160,0.35)"/>
      <text x="20" y="28" fill="#6ed3a0" font-size="13">/</text>
      <text x="50" y="28" fill="#f2f0e9" font-size="13">agencia ia para facturación recurrente</text>
      <text x="900" y="28" text-anchor="end" fill="#6ed3a0" font-size="13">#3</text>
    </g>
  </g>
  <!-- cluster map -->
  <g transform="translate(120,400)" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="6" fill="#6ed3a0"/>
    <g fill="#6ed3a0" opacity="0.8">
      <circle cx="100" cy="-30" r="4"/>
      <circle cx="120" cy="60" r="4"/>
      <circle cx="-80" cy="-50" r="4"/>
      <circle cx="-100" cy="80" r="4"/>
      <circle cx="160" cy="-90" r="3"/>
      <circle cx="180" cy="120" r="3"/>
      <circle cx="-150" cy="-100" r="3"/>
      <circle cx="-170" cy="140" r="3"/>
