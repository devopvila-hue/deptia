<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="RRHH — cultura viva" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-rrhh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1810"/>
      <stop offset="1" stop-color="#080908"/>
    </linearGradient>
    <radialGradient id="glow-rrhh" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="rgba(245,168,102,0.20)"/>
      <stop offset="0.5" stop-color="rgba(245,168,102,0.06)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <pattern id="grid-rrhh" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(242,240,233,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#bg-rrhh)"/>
  <rect width="1280" height="720" fill="url(#grid-rrhh)" opacity="0.5"/>
  <rect width="1280" height="720" fill="url(#glow-rrhh)"/>
  <!-- team avatars row -->
  <g transform="translate(440,200)">
    <g fill="none" stroke="#f5a866" stroke-width="1.5" opacity="0.85">
      <circle cx="60" cy="60" r="32"/>
      <circle cx="60" cy="50" r="10" fill="#f5a866"/>
      <path d="M40 86 C 40 68, 80 68, 80 86" stroke-linecap="round"/>
    </g>
    <g fill="none" stroke="#f5a866" stroke-width="1.5" opacity="0.95">
      <circle cx="200" cy="60" r="36" fill="rgba(245,168,102,0.18)"/>
      <circle cx="200" cy="48" r="11" fill="#f5a866"/>
      <path d="M178 90 C 178 70, 222 70, 222 90" stroke-linecap="round"/>
    </g>
    <g fill="none" stroke="#f5a866" stroke-width="1.5" opacity="0.85">
      <circle cx="340" cy="60" r="32"/>
      <circle cx="340" cy="50" r="10" fill="#f5a866"/>
      <path d="M320 86 C 320 68, 360 68, 360 86" stroke-linecap="round"/>
    </g>
  </g>
  <!-- onboarding timeline -->
  <g transform="translate(160,420)" font-family="ui-monospace, monospace" fill="#c2c4bc">
    <text x="0" y="0" font-size="11" letter-spacing="2" opacity="0.7">ONBOARDING · PRIMER MES</text>
    <line x1="0" y1="40" x2="960" y2="40" stroke="rgba(245,168,102,0.4)"/>
    {[
      { x: 0, label: "D-7", title: "Bienvenida" },
      { x: 200, label: "D 1", title: "Setup" },
      { x: 400, label: "D 7", title: "Pares" },
      { x: 600, label: "D 14", title: "Misión 1" },
      { x: 800, label: "D 30", title: "Retrospectiva" },
    ].map((s, i) => (
      <g key={i}>
        <circle cx={s.x} cy="40" r="6" fill="#f5a866" />
        <text x={s.x} y="80" font-size="11" letter-spacing="2" text-anchor="middle">{s.label}</text>
        <text x={s.x} y="104" font-size="13" text-anchor="middle">{s.title}</text>
      </g>
    ))}
  </g>
  <text x="40" y="48" font-family="ui-monospace, monospace" fill="#c2c4bc" font-size="11" letter-spacing="3" opacity="0.7">DEPT · RR.HH.</text>
  <text x="1240" y="48" text-anchor="end" font-family="ui-monospace, monospace" fill="#989b94" font-size="11" letter-spacing="3" opacity="0.7">PERSONAS · CULTURA · CUIDADO</text>
</svg>
