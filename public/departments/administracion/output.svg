      <text x="480" y="345" text-anchor="middle" fill="#989b94" font-size="11">JUL</text>
      <rect x="560" y="10" width="120" height="250" rx="6" fill="#0c0e0a" stroke="rgba(240,135,117,0.25)"/>
      <rect x="560" y="140" width="120" height="120" fill="#f08775"/>
      <text x="620" y="345" text-anchor="middle" fill="#989b94" font-size="11">AGO</text>
      <rect x="700" y="0" width="120" height="260" rx="6" fill="#0c0e0a" stroke="rgba(240,135,117,0.4)"/>
      <rect x="700" y="120" width="120" height="140" fill="#f08775"/>
      <text x="760" y="345" text-anchor="middle" fill="#f08775" font-size="11">SEP</text>
