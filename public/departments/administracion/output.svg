      <text x="60" y="345" text-anchor="middle" fill="#989b94" font-size="11">ABR</text>
      <rect x="140" y="60" width="120" height="200" rx="6" fill="#0c0e0a" stroke="rgba(240,135,117,0.25)"/>
      <rect x="140" y="200" width="120" height="60" fill="#f08775"/>
      <text x="200" y="345" text-anchor="middle" fill="#989b94" font-size="11">MAY</text>
      <rect x="280" y="40" width="120" height="220" rx="6" fill="#0c0e0a" stroke="rgba(240,135,117,0.25)"/>
      <rect x="280" y="180" width="120" height="80" fill="#f08775"/>
      <text x="340" y="345" text-anchor="middle" fill="#989b94" font-size="11">JUN</text>
      <rect x="420" y="20" width="120" height="240" rx="6" fill="#0c0e0a" stroke="rgba(240,135,117,0.25)"/>
