<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Administración — entregables" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-out-adm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1310"/>
      <stop offset="1" stop-color="#080908"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg-out-adm)"/>
  <!-- summary tiles -->
  <g font-family="ui-monospace, monospace">
