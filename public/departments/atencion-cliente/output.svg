<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Atención al cliente — entregables" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-out-spt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191524"/>
      <stop offset="1" stop-color="#080908"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg-out-spt)"/>
  <!-- satisfaction gauge -->
  <g transform="translate(280,360)">
    <circle r="120" fill="none" stroke="rgba(196,163,255,0.18)" stroke-width="14"/>
    <circle r="120" fill="none" stroke="#c4a3ff" stroke-width="14" stroke-dasharray="610 754" transform="rotate(-90)"/>
    <text x="0" y="10" text-anchor="middle" fill="#f2f0e9" font-family="serif" font-size="56">94%</text>
    <text x="0" y="42" text-anchor="middle" fill="#989b94" font-family="ui-monospace, monospace" font-size="11" letter-spacing="3">CSAT</text>
  </g>
  <!-- right column metrics -->
  <g font-family="ui-monospace, monospace" transform="translate(560,200)">
    <g>
      <rect width="280" height="80" rx="10" fill="#0c0e0a" stroke="rgba(196,163,255,0.25)"/>
      <text x="24" y="32" fill="#989b94" font-size="11" letter-spacing="2">TIEMPO MEDIO</text>
      <text x="24" y="64" fill="#c4a3ff" font-family="serif" font-size="28">12 min</text>
    </g>
    <g transform="translate(0,100)">
      <rect width="280" height="80" rx="10" fill="#0c0e0a" stroke="rgba(196,163,255,0.25)"/>
      <text x="24" y="32" fill="#989b94" font-size="11" letter-spacing="2">COBERTURA</text>
      <text x="24" y="64" fill="#c4a3ff" font-family="serif" font-size="28">24/7</text>
    </g>
    <g transform="translate(0,200)">
      <rect width="280" height="80" rx="10" fill="#0c0e0a" stroke="rgba(196,163,255,0.25)"/>
      <text x="24" y="32" fill="#989b94" font-size="11" letter-spacing="2">ESCALADOS</text>
      <text x="24" y="64" fill="#c4a3ff" font-family="serif" font-size="28">7%</text>
    </g>
  </g>
  <text x="40" y="40" font-family="ui-monospace, monospace" fill="#c2c4bc" font-size="11" letter-spacing="2" opacity="0.7">SOPORTE · OUTPUT · MES EN CURSO</text>
</svg>
