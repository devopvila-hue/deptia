<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Logística — supply chain" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-log" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1a17"/>
      <stop offset="1" stop-color="#080908"/>
    </linearGradient>
    <radialGradient id="glow-log" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="rgba(122,220,181,0.20)"/>
      <stop offset="0.5" stop-color="rgba(122,220,181,0.06)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <pattern id="grid-log" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(242,240,233,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#bg-log)"/>
  <rect width="1280" height="720" fill="url(#grid-log)" opacity="0.5"/>
  <rect width="1280" height="720" fill="url(#glow-log)"/>
  <!-- supply chain network -->
  <g transform="translate(640,360)" stroke="#7adcb5" fill="none">
    <line x1="-260" y1="0" x2="-100" y2="0" stroke-width="1" opacity="0.5"/>
    <line x1="100" y1="0" x2="260" y2="0" stroke-width="1" opacity="0.5"/>
    <line x1="-180" y1="-90" x2="-40" y2="-40" stroke-width="1" opacity="0.4"/>
    <line x1="-180" y1="90" x2="-40" y2="40" stroke-width="1" opacity="0.4"/>
    <line x1="180" y1="-90" x2="40" y2="-40" stroke-width="1" opacity="0.4"/>
    <line x1="180" y1="90" x2="40" y2="40" stroke-width="1" opacity="0.4"/>
    <!-- hub -->
    <circle cx="0" cy="0" r="40" fill="rgba(122,220,181,0.18)"/>
    <circle cx="0" cy="0" r="22" fill="rgba(122,220,181,0.32)"/>
    <circle cx="0" cy="0" r="6" fill="#7adcb5"/>
    <!-- suppliers -->
    <g fill="#7adcb5">
      <circle cx="-260" cy="0" r="6"/>
      <circle cx="260" cy="0" r="6"/>
      <circle cx="-180" cy="-90" r="5"/>
      <circle cx="180" cy="-90" r="5"/>
      <circle cx="-180" cy="90" r="5"/>
      <circle cx="180" cy="90" r="5"/>
    </g>
    <!-- labels -->
    <g font-family="ui-monospace, monospace" font-size="11" fill="#c2c4bc" letter-spacing="2">
      <text x="-260" y="22" text-anchor="middle">ALMACÉN</text>
      <text x="260" y="22" text-anchor="middle">DESTINO</text>
      <text x="-180" y="-104" text-anchor="middle">SUP. A</text>
      <text x="180" y="-104" text-anchor="middle">SUP. B</text>
      <text x="-180" y="116" text-anchor="middle">SUP. C</text>
      <text x="180" y="116" text-anchor="middle">SUP. D</text>
      <text x="0" y="-50" text-anchor="middle" fill="#7adcb5">HUB</text>
    </g>
  </g>
  <!-- truck silhouette -->
  <g transform="translate(160,560)" fill="none" stroke="#7adcb5" stroke-width="1.4">
    <rect x="0" y="0" width="120" height="40" rx="4"/>
    <path d="M120 0 L150 0 L170 20 L170 40 L120 40 Z"/>
    <circle cx="36" cy="48" r="8" fill="#0c0e0a"/>
    <circle cx="100" cy="48" r="8" fill="#0c0e0a"/>
    <circle cx="148" cy="48" r="8" fill="#0c0e0a"/>
  </g>
  <!-- package -->
  <g transform="translate(560,560)" fill="none" stroke="#7adcb5" stroke-width="1.4" opacity="0.85">
    <rect x="0" y="0" width="60" height="60" rx="3"/>
    <line x1="0" y1="20" x2="60" y2="20"/>
    <line x1="0" y1="40" x2="60" y2="40"/>
    <line x1="30" y1="0" x2="30" y2="60"/>
  </g>
  <!-- status badge -->
  <g transform="translate(960,520)" font-family="ui-monospace, monospace">
    <rect x="0" y="0" width="200" height="80" rx="10" fill="#0c0e0a" stroke="rgba(122,220,181,0.4)"/>
    <circle cx="20" cy="40" r="6" fill="#7adcb5"/>
    <text x="40" y="32" font-size="11" letter-spacing="2" fill="#989b94">EN TRÁNSITO</text>
    <text x="40" y="56" font-size="14" fill="#f2f0e9">PED #2314</text>
  </g>
  <text x="40" y="48" font-family="ui-monospace, monospace" fill="#c2c4bc" font-size="11" letter-spacing="3" opacity="0.7">DEPT · LOGÍSTICA</text>
  <text x="1240" y="48" text-anchor="end" font-family="ui-monospace, monospace" fill="#989b94" font-size="11" letter-spacing="3" opacity="0.7">SLAs · RUTAS · TRAZABILIDAD</text>
</svg>
