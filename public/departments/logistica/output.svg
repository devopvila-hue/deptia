<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Logística — entregables" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-out-log" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1a17"/>
      <stop offset="1" stop-color="#080908"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg-out-log)"/>
  <!-- map grid -->
  <g stroke="rgba(122,220,181,0.18)" stroke-width="1">
    {Array.from({ length: 11 }).map((_, i) => (
      <line key={`v${i}`} x1={120 + i * 100} y1="160" x2={120 + i * 100} y2="540" />
    ))}
    {Array.from({ length: 5 }).map((_, i) => (
      <line key={`h${i}`} x1="120" y1={160 + i * 95} x2="1120" y2={160 + i * 95} />
    ))}
  </g>
  <!-- 3 routes -->
  <g fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M 200 480 Q 400 200, 600 320 T 1080 200" stroke="#7adcb5" opacity="0.85" />
    <path d="M 220 200 Q 460 480, 700 380 T 1080 460" stroke="#7adcb5" opacity="0.55" />
    <path d="M 200 320 Q 520 180, 760 460 T 1100 320" stroke="#7adcb5" opacity="0.4" />
  </g>
  <!-- KPIs -->
  <g font-family="ui-monospace, monospace" transform="translate(120,560)">
    <g>
      <rect width="240" height="100" rx="12" fill="#0c0e0a" stroke="rgba(122,220,181,0.3)"/>
      <text x="20" y="34" font-size="11" letter-spacing="2" fill="#989b94">SLA CUMPLIDO</text>
      <text x="20" y="74" font-family="serif" font-size="36" fill="#7adcb5">96.4%</text>
    </g>
    <g transform="translate(260,0)">
      <rect width="240" height="100" rx="12" fill="#0c0e0a" stroke="rgba(122,220,181,0.3)"/>
      <text x="20" y="34" font-size="11" letter-spacing="2" fill="#989b94">PEDIDOS HOY</text>
      <text x="20" y="74" font-family="serif" font-size="36" fill="#7adcb5">1.240</text>
    </g>
    <g transform="translate(520,0)">
      <rect width="240" height="100" rx="12" fill="#0c0e0a" stroke="rgba(122,220,181,0.3)"/>
      <text x="20" y="34" font-size="11" letter-spacing="2" fill="#989b94">INCIDENCIAS</text>
      <text x="20" y="74" font-family="serif" font-size="36" fill="#ffbd59">7</text>
    </g>
  </g>
  <text x="40" y="48" font-family="ui-monospace, monospace" fill="#c2c4bc" font-size="11" letter-spacing="2" opacity="0.7">LOGÍSTICA · OUTPUT · HOY</text>
</svg>
