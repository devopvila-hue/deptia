<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" role="img" aria-label="DEPARTIFY">
  <title>DEPARTIFY</title>
  <!-- Mark — same anatomy as the Portal's <Logo /> and the
       landing's <BrandMark />: rounded square + 2 vertical bars
       + 1 diagonal polygon. ViewBox 0 0 64 64. -->
  <g transform="translate(0, 13)">
    <rect width="64" height="64" rx="14" ry="14" fill="#101214"/>
    <g fill="#FFFFFF">
      <rect x="15" y="14" width="6" height="36"/>
      <rect x="43" y="14" width="6" height="36"/>
      <polygon points="15,14 21,14 49,50 43,50"/>
    </g>
  </g>
  <!-- Wordmark -->
  <g transform="translate(84, 0)" fill="#101214" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
    <text x="0" y="42" font-size="30" font-weight="600" letter-spacing="-0.6">DEPARTIFY</text>
    <text x="0" y="62" font-size="10" font-weight="500" letter-spacing="2.4" opacity="0.78">BUSINESS OPERATING SYSTEM</text>
  </g>
</svg>
